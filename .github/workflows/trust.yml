name: trust

# The public evidence pipeline. The conformance job produces the
# accounting-standards corpus (ASC/IFRS) against a real kernel; the publish
# job combines it with the ledger checkpoint emitted by the SOLE golden
# harness run in test.yml's integration job.
#
# The sim + harness copy that used to live here as the `invariants` job was
# deleted 2026-09 as byte-identical duplication (same profile, seed, window,
# and commands as test.yml integration). test.yml is now the single owner of
# the checkpoint; this workflow consumes it via workflow_run and never
# produces simulation evidence of its own. A failing conformance case is a
# red build, not a footnote.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/trust/**"
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, so the evidence has a time series even in a quiet week.
    - cron: "17 6 * * *"
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

concurrency:
  group: trust-${{ github.ref }}
  cancel-in-progress: true

env:
  SESSION_SECRET: openbooks-ci-test-secret-not-production
  OPENBOOKS_DATA_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  ORG_COUNTRY: US
  ORG_CURRENCY: USD

jobs:
  conformance:
    name: standards conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks
          POSTGRES_DB: openbooks_conformance
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks -d openbooks_conformance"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPENBOOKS_DB_URL: postgres://openbooks:openbooks@localhost:5433/openbooks_conformance
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-ci-password@localhost:5433/openbooks_conformance
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-ci-password
      OPENBOOKS_TRUSTED_TEST_BYPASS: "1"
      PGPASSWORD: openbooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Load schema
        run: npx tsx scripts/bootstrap.ts

      - name: Run the conformance corpus
        # The ledger tier posts real documents through the accounting kernel.
        # Without a database those cases report "not run" rather than passing,
        # so the ledger-tier canary below fails the job if that happens here.
        run: |
          node --import tsx --import ./engine/src/test-database-bypass.ts \
            engine/src/conformance/cli.ts report --out .local/conformance

      - name: Ledger-tier canary
        # A corpus that silently degraded to computation-only would still be
        # green. Fail unless ledger-tier cases actually executed.
        run: |
          node -e '
            const r = require("./.local/conformance/conformance.json");
            const ledger = r.cases.filter(c => c.tier === "ledger" && c.support !== "not-implemented");
            const notRun = ledger.filter(c => c.status === "skipped");
            if (ledger.length === 0) { console.error("FATAL: no ledger-tier cases in the corpus"); process.exit(1); }
            if (notRun.length > 0) {
              console.error("FATAL: ledger-tier cases did not run — database wiring is broken:");
              for (const c of notRun) console.error("  - " + c.id);
              process.exit(1);
            }
            console.log("canary ok: " + ledger.length + " ledger-tier cases executed against the kernel");
          '

      - name: Summary
        if: always()
        run: |
          {
            echo "# Standards conformance"
            echo ""
            sed -n '1,40p' .local/conformance/conformance-matrix.md 2>/dev/null || echo "no matrix produced"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conformance
          path: .local/conformance/
          if-no-files-found: error

  publish:
    name: publish trust corpus
    # Consumer, not producer: the checkpoint comes from the test.yml
    # integration run that triggered this workflow; conformance is produced
    # by the job below in this same run. The invariants sim/harness job was
    # deleted 2026-09 as duplication of test.yml integration, so there is no
    # longer a same-run checkpoint to `needs:` — the workflow_run trigger is
    # what binds this corpus to a green, harness-gated test run on main.
    needs: [conformance]
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: conformance
          path: .local/conformance

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checkpoint
          path: engine/harness-checkpoints
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build badges, matrix, and history
        # On workflow_run the default GITHUB_SHA is the trust branch tip, not
        # the tested commit. Stamp the corpus with the head SHA of the test
        # run the checkpoint came from, or provenance silently drifts.
        run: |
          node scripts/publish-trust.mjs \
            --conformance .local/conformance \
            --checkpoint engine/harness-checkpoints \
            --out docs/trust \
            --sha "${{ github.event.workflow_run.head_sha }}"

      - name: Upload trust corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trust-corpus
          path: docs/trust
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### Trust corpus"
            echo
            echo "Built for \`${{ github.event.workflow_run.head_sha }}\`. Download the **trust-corpus** artifact from this run."
            echo
            if [ -f docs/trust/conformance-matrix.md ]; then
              head -40 docs/trust/conformance-matrix.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
