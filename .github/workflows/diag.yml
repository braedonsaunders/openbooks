name: Cluster diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 5
    steps:
      - name: Clean stale compose network
        run: |
          set +e
          PREFIX=compose-bypass-open-source-driver-miu7hf
          echo "=== stale containers ==="
          docker ps -a --filter "name=$PREFIX" --format '{{.Names}} {{.Status}}'
          docker ps -aq --filter "name=$PREFIX" | xargs -r docker rm -f
          echo "=== networks named $PREFIX ==="
          docker network ls --filter "name=$PREFIX" --format '{{.Name}} {{.Driver}} {{.Scope}}'
          docker network ls --filter "name=$PREFIX" -q | xargs -r docker network rm
          echo "=== after cleanup ==="
          docker network ls --filter "name=$PREFIX" --format '{{.Name}}'
          echo "done"
