name: Cluster diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 5
    steps:
      - name: Probe Traefik providers
        run: |
          set +e
          echo "=== traefik:8080 reachable? total routers ==="
          curl -s -m 8 http://traefik:8080/api/http/routers -o /tmp/routers.json -w "http_code=%{http_code}\n"
          echo "router count: $(cat /tmp/routers.json | grep -o '\"name\"' | wc -l)"
          echo "=== routers whose rule mentions openbooks OR name has openbooks ==="
          cat /tmp/routers.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('name'),'|',r.get('rule'),'|',r.get('status'),'|',r.get('provider')) for r in d if 'openbook' in json.dumps(r).lower()]" 2>/dev/null
          echo "=== all router providers (unique) ==="
          cat /tmp/routers.json | python3 -c "import json,sys; d=json.load(sys.stdin); import collections; print(collections.Counter(r.get('provider') for r in d))" 2>/dev/null
          echo "=== docker-provider routers (sample rules) ==="
          cat /tmp/routers.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('name'),'|',r.get('rule')) for r in d if r.get('provider')=='docker'][:15]" 2>/dev/null
          echo "=== baseline: s3-dev route present? ==="
          cat /tmp/routers.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('name'),'|',r.get('rule'),'|',r.get('provider')) for r in d if 's3-dev' in json.dumps(r).lower()]" 2>/dev/null
          echo "=== bidwright route present? (docker provider proof) ==="
          cat /tmp/routers.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(r.get('name'),'|',r.get('provider')) for r in d if 'bidwright' in json.dumps(r).lower()]" 2>/dev/null
