name: Deploy edge

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  deploy-edge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - name: Dispatch edge container publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The tested commit must be a full lowercase SHA-1." >&2
            exit 1
          fi

          short_sha="${TRIGGER_SHA:0:7}"
          version="edge-${short_sha}"
          dispatch_payload="$(
            jq --compact-output --null-input \
              --arg ref "main" \
              --arg version "$version" \
              --arg commitSha "$TRIGGER_SHA" \
              '{
                ref: $ref,
                inputs: {
                  version: $version,
                  commit_sha: $commitSha
                },
                return_run_details: true
              }'
          )"

          echo "Dispatching publish-container.yml for ${TRIGGER_SHA} as ${version}."
          dispatch_response="$(
            gh api \
              --method POST \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-container.yml/dispatches" \
              --input - <<< "$dispatch_payload"
          )"
          publish_run_id="$(
            jq --exit-status --raw-output \
              '.workflow_run_id | select(type == "number" and . > 0)' \
              <<< "$dispatch_response"
          )"
          publish_run_url="$(
            jq --exit-status --raw-output \
              '.html_url | select(type == "string" and length > 0)' \
              <<< "$dispatch_response"
          )"

          echo "Dispatched exact publish run ${publish_run_id}: ${publish_run_url}"
          echo "run_id=${publish_run_id}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Wait for edge container publish
        timeout-minutes: 120
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ steps.publish.outputs.run_id }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$PUBLISH_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The ${VERSION} dispatch did not return a valid workflow run ID." >&2
            exit 1
          fi

          echo "Watching exact publish run ${PUBLISH_RUN_ID} for ${VERSION}."
          gh run watch "$PUBLISH_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status \
            --interval 10
