name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Image tag for a manual build
        required: true
        default: edge
      commit_sha:
        description: Full commit SHA to verify and publish
        required: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || (github.event_name == 'push' && github.sha) }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # The exact-source merge gate already proves workspace types and the
    # production build used by browser tests. Recheck release policies here;
    # the Docker job builds the actual scanned deployment artifact once.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks_owner
          POSTGRES_PASSWORD: openbooks-owner-release-test-password
          POSTGRES_DB: openbooks_release
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks_owner -d openbooks_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPENBOOKS_DB_URL: postgres://openbooks_owner:openbooks-owner-release-test-password@localhost:5433/openbooks_release
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-release-test-password@localhost:5433/openbooks_release
      OPENBOOKS_REDIS_URL: redis://localhost:6379
      SESSION_SECRET: openbooks-release-test-secret-not-production
      OPENBOOKS_DATA_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      ORG_COUNTRY: US
      ORG_CURRENCY: USD
      PGPASSWORD: openbooks-owner-release-test-password
    steps:
      - name: Validate the pinned source commit
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOURCE_COMMIT must be a full lowercase SHA-1." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          # The release gate below asks whether this commit is an ancestor of
          # main. A depth-1 checkout has neither the history nor the ref, so
          # the question cannot be answered and the gate stops gating.
          fetch-depth: 0
      - name: Require a green merge gate for this exact commit
        # The suite is NOT re-run here. test.yml already ran it — unit,
        # pooled integration, sim and golden harness — against this exact SHA,
        # and re-running it cost ~35 minutes per release to reproduce a result
        # that already existed. That trade is only sound if the green run is
        # verified rather than assumed, so this fails closed: no successful
        # `test` run for this commit, no release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          conclusions=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_COMMIT}&status=success" \
            --jq '[.workflow_runs[] | select(.name == "test") | .conclusion] | join(" ")')
          if ! grep -qw success <<< "$conclusions"; then
            echo "No successful 'test' run for ${SOURCE_COMMIT}." >&2
            echo "The merge gate must pass on the exact commit being released." >&2
            exit 1
          fi
          echo "Merge gate is green for ${SOURCE_COMMIT}; running release-only checks."
      - name: Refuse to release a commit that is not on main
        # Checking out an explicit ref leaves HEAD detached, so the local `main`
        # branch does not exist even with full history. Materialize it, then
        # require the pinned commit to be an ancestor of it.
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/heads/main
          echo "main is now $(git rev-parse main)"
          git merge-base --is-ancestor "$SOURCE_COMMIT" main \
            || { echo "the pinned source commit is not on main; refusing to release it" >&2; exit 1; }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify deployment workflow contracts
        run: node --test scripts/deploy-edge-workflow.test.mjs
      - name: Bootstrap a clean release database
        env:
          NODE_ENV: production
        run: npx tsx scripts/bootstrap.ts
      - name: Prove production runtime role cannot bypass tenant RLS
        env:
          NODE_ENV: production
          OPENBOOKS_DB_URL: postgres://openbooks_app:openbooks-runtime-release-test-password@localhost:5433/openbooks_release
        run: >-
          npx tsx -e "import { assertSafeRuntimeDatabaseRole, pool } from './engine/src/db.ts';
          void (async () => { try { await assertSafeRuntimeDatabaseRole(); }
          finally { await pool.end(); } })();"
      - name: Verify release policies
        run: npm run verify:release:checks

  container-security:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable-image labels
        id: scan-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=OpenBooks
            org.opencontainers.image.description=Open-source accounting-first ERP
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
      - name: Build and push the native candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          tags: ${{ env.IMAGE_NAME }}:scan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: ${{ steps.scan-meta.outputs.labels }}
          build-args: |
            OPENBOOKS_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max,ignore-error=true
      # Debian may publish advisories before patched packages exist. Block the
      # release on every fixable HIGH/CRITICAL finding; the scheduled security
      # workflow continues reporting newly disclosed, not-yet-fixable issues.
      - name: Scan the native image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          version: v0.70.0
          vuln-type: os,library
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Record the scanned immutable image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p scanned-images
          jq -n --arg arch "$ARCH" --arg platform "$PLATFORM" --arg digest "$DIGEST" \
            --arg source "$SOURCE_COMMIT" --arg runId "$GITHUB_RUN_ID" \
            '{arch:$arch,platform:$platform,digest:$digest,source:$source,runId:$runId}' \
            > "scanned-images/$ARCH.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-image-${{ matrix.arch }}
          path: scanned-images/${{ matrix.arch }}.json
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [verify, container-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scanned-image-*
          path: scanned-images
          merge-multiple: true
      - name: Merge and verify both scanned native images
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          source_refs="$(node scripts/scanned-image-manifest.mjs sources scanned-images)"
          mapfile -t sources <<< "$source_refs"
          docker buildx imagetools create --metadata-file merged-image.json \
            --tag "$IMAGE_NAME:scanned-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "${sources[@]}"
          digest="$(node scripts/scanned-image-manifest.mjs digest merged-image.json)"
          docker buildx imagetools inspect "$IMAGE_NAME@$digest" --raw > merged-manifest.json
          node scripts/scanned-image-manifest.mjs verify scanned-images merged-manifest.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=OpenBooks
            org.opencontainers.image.description=Open-source accounting-first ERP
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
      - name: Publish tags for the exact scanned digest
        env:
          OPENBOOKS_RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          OPENBOOKS_SCANNED_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.merge.outputs.digest }}
        run: |
          # Without pipefail a failing `sed` would yield an empty tag list
          # that only the explicit count check below catches.
          set -o pipefail
          mapfile -t release_tags < <(printf '%s\n' "$OPENBOOKS_RELEASE_TAGS" | sed '/^$/d')
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "No release tags were generated" >&2
            exit 1
          fi
          tag_args=()
          for release_tag in "${release_tags[@]}"; do
            tag_args+=(--tag "$release_tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "$OPENBOOKS_SCANNED_IMAGE"
      - name: Attest published image
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true
