name: Publish container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Image tag for a manual build
        required: true
        default: edge
      commit_sha:
        description: Full commit SHA to verify and publish
        required: true

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  SOURCE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || (github.event_name == 'push' && github.sha) }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks_owner
          POSTGRES_PASSWORD: openbooks-owner-release-test-password
          POSTGRES_DB: openbooks_release
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks_owner -d openbooks_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPENBOOKS_DB_URL: postgres://openbooks_owner:openbooks-owner-release-test-password@localhost:5433/openbooks_release
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-release-test-password@localhost:5433/openbooks_release
      OPENBOOKS_REDIS_URL: redis://localhost:6379
      SESSION_SECRET: openbooks-release-test-secret-not-production
      OPENBOOKS_DATA_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      ORG_COUNTRY: US
      ORG_CURRENCY: USD
      PGPASSWORD: openbooks-owner-release-test-password
    steps:
      - name: Validate the pinned source commit
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOURCE_COMMIT must be a full lowercase SHA-1." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify deployment workflow contracts
        run: node --test scripts/deploy-edge-workflow.test.mjs
      - name: Bootstrap a clean release database
        env:
          NODE_ENV: production
        run: npx tsx scripts/bootstrap.ts
      - name: Prove production runtime role cannot bypass tenant RLS
        env:
          NODE_ENV: production
          OPENBOOKS_DB_URL: postgres://openbooks_app:openbooks-runtime-release-test-password@localhost:5433/openbooks_release
        run: >-
          npx tsx -e "import { assertSafeRuntimeDatabaseRole, pool } from './engine/src/db.ts';
          void (async () => { try { await assertSafeRuntimeDatabaseRole(); }
          finally { await pool.end(); } })();"
      - name: Verify types, accounting tests, and production build
        run: npm run verify:release

  container-security:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable-image labels
        id: scan-meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=OpenBooks
            org.opencontainers.image.description=Open-source accounting-first ERP
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
      - name: Build and push the exact multi-platform candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:scan-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.scan-meta.outputs.labels }}
          build-args: |
            OPENBOOKS_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      # Debian may publish advisories before patched packages exist. Block the
      # release on every fixable HIGH/CRITICAL finding; the scheduled security
      # workflow continues reporting newly disclosed, not-yet-fixable issues.
      - name: Scan the exact amd64 manifest for fixable vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          version: v0.70.0
          vuln-type: os,library
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the exact arm64 manifest for fixable vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          version: v0.70.0
          skip-setup-trivy: true
          vuln-type: os,library
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: [verify, container-security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ needs.container-security.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=OpenBooks
            org.opencontainers.image.description=Open-source accounting-first ERP
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
      - name: Publish tags for the exact scanned digest
        env:
          OPENBOOKS_RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
          OPENBOOKS_SCANNED_IMAGE: ${{ env.IMAGE_NAME }}@${{ needs.container-security.outputs.digest }}
        run: |
          mapfile -t release_tags < <(printf '%s\n' "$OPENBOOKS_RELEASE_TAGS" | sed '/^$/d')
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "No release tags were generated" >&2
            exit 1
          fi
          tag_args=()
          for release_tag in "${release_tags[@]}"; do
            tag_args+=(--tag "$release_tag")
          done
          docker buildx imagetools create "${tag_args[@]}" "$OPENBOOKS_SCANNED_IMAGE"
      - name: Attest published image
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.container-security.outputs.digest }}
          push-to-registry: true
