name: sim-smoke

# Deterministic smoke of the business-simulation harness: stand up a throwaway
# Postgres, load the schema, provision a company, and run it on autopilot (the
# non-LLM persona stand-in) for a short window. The invariant oracle gates each
# period — a failure fails the job with the defect bundle attached.

on:
  pull_request:
    paths:
      - "engine/src/sim/**"
      - "engine/src/clock.ts"
      - "engine/src/posting.ts"
      - "engine/src/payments.ts"
      - "engine/src/close.ts"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks
          POSTGRES_DB: openbooks_sim
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks -d openbooks_sim"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPENBOOKS_SIM: "1"
      OPENBOOKS_DB_URL: postgres://openbooks:openbooks@localhost:5433/openbooks_sim
      ORG_COUNTRY: US
      ORG_CURRENCY: USD
      PGPASSWORD: openbooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci

      - name: Load schema
        # Use the production bootstrap so CI exercises the authoritative
        # Canonical schema baseline, row-level security, and base seeds.
        run: npx tsx scripts/bootstrap.ts

      - name: Typecheck
        run: npm --prefix engine run typecheck

      - name: Provision + run (autopilot)
        run: |
          # Without pipefail the pipeline reports `node`'s status, so a failed
          # provision that still emitted parseable JSON would read as success.
          set -o pipefail
          RUN=$(npm --prefix engine run --silent sim -- provision \
            --profile general-contractor --seed 1 --start 2026-01-01 --end 2026-03-31 \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runDir))')
          echo "run dir: $RUN"
          npm --prefix engine run --silent sim -- run "$RUN"
          npm --prefix engine run --silent sim -- coverage "$RUN" \
            --require vendor_bill,vendor_payment,customer_invoice,customer_payment,period_close,period_immutability

      - name: Upload defect bundles (if any)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sim-defects
          path: engine/sim-runs/**/defects/**
          if-no-files-found: ignore
