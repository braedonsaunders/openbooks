name: CI + Deploy (dev)

# Every push to main: typecheck + build gate → publish the image to ghcr →
# point the Dokploy "openbooks" compose at the new tag and redeploy → wait for
# the health endpoint to serve the new build.
#
# Secrets: DOKPLOY_URL (http://dokploy:3000 — the panel is LAN-only, reached
#          from the shared self-hosted runner over dokploy-network),
#          DOKPLOY_TOKEN (x-api-key), DOKPLOY_COMPOSE_ID (openbooks compose).
#
# The deploy job runs on the shared Dokploy runner (openbooks-runner in the
# github-runners project); check/build stay on GitHub-hosted runners.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/braedonsaunders/openbooks

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck web (web-local TypeScript 5.9)
        run: cd web && node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: Typecheck engine
        run: cd engine && ../web/node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: Typecheck schema
        run: cd schema && ../web/node_modules/.bin/tsc --noEmit -p tsconfig.json

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 20
    environment: dev
    steps:
      - name: Point Dokploy at the new image tag
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
          env_text="$(echo "$current" | jq -r '.env // ""')"
          if echo "$env_text" | grep -q '^OPENBOOKS_TAG='; then
            new_env="$(echo "$env_text" | sed "s|^OPENBOOKS_TAG=.*|OPENBOOKS_TAG=${NEW_TAG}|")"
          else
            new_env="$(printf '%s\nOPENBOOKS_TAG=%s\n' "$env_text" "$NEW_TAG")"
          fi
          jq -n --arg id "$COMPOSE_ID" --arg env "$new_env" '{composeId:$id, env:$env}' \
            | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' \
                -X POST "$base/api/compose.update" --data @- > /dev/null
          echo "Dokploy env now pins OPENBOOKS_TAG=${NEW_TAG}"

      - name: Trigger deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -H 'content-type: application/json' \
            -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            --data "{\"composeId\":\"$COMPOSE_ID\"}"
          echo "Deployment queued"

      - name: Wait for Dokploy deployment to finish
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          for i in $(seq 1 60); do
            sleep 10
            latest="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
              -G "$base/api/deployment.allByCompose" --data-urlencode "composeId=$COMPOSE_ID" \
              | jq -r 'sort_by(.createdAt) | last | .status // "unknown"')"
            echo "deployment status: $latest (poll $i)"
            case "$latest" in
              done) exit 0 ;;
              error) echo "::error::Dokploy deployment failed — check the compose logs in Dokploy"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for the Dokploy deployment"
          exit 1

      - name: Verify the app is healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://openbooks.cloud.rassaun.com/api/v1/health || true)"
            echo "health: HTTP $code (poll $i)"
            if [ "$code" = "200" ]; then
              echo "openbooks dev is up: https://openbooks.cloud.rassaun.com"
              exit 0
            fi
            sleep 10
          done
          echo "::error::App never became healthy at openbooks.cloud.rassaun.com"
          exit 1
