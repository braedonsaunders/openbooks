name: CI + Deploy (dev)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck web
        run: cd web && node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: Typecheck engine
        run: cd engine && ../web/node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: Typecheck schema
        run: cd schema && ../web/node_modules/.bin/tsc --noEmit -p tsconfig.json

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:dev
          build-args: |
            OPENBOOKS_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, dokploy]
    timeout-minutes: 20
    environment: dev
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run deployment bootstrap
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
          env_text="$(jq -r '.env // ""' <<<"$current")"
          env_value() {
            local key="$1"
            sed -n "s/^${key}=//p" <<<"$env_text" | head -n 1
          }
          compose_web_value() {
            local key="$1"
            awk -v key="$key" '
              /^  web:[[:space:]]*$/ { in_web=1; next }
              in_web && /^  [[:alnum:]_-]+:[[:space:]]*$/ { exit }
              in_web && $0 ~ "^[[:space:]]+" key ":[[:space:]]*" {
                sub("^[[:space:]]+" key ":[[:space:]]*", "")
                gsub(/^["'\''"]|["'\''"]$/, "")
                print
                exit
              }
              in_web && $0 ~ "^[[:space:]]*-[[:space:]]*" key "=" {
                sub("^[[:space:]]*-[[:space:]]*" key "=", "")
                print
                exit
              }
            ' <<<"$(jq -r '.composeFile // ""' <<<"$current")"
          }
          resolve_placeholders() {
            local value="$1" token key replacement
            while [[ "$value" =~ (\$\{([A-Z0-9_]+)\}) ]]; do
              token="${BASH_REMATCH[1]}"
              key="${BASH_REMATCH[2]}"
              replacement="$(env_value "$key")"
              if [ -z "$replacement" ]; then return 1; fi
              value="${value//$token/$replacement}"
            done
            printf '%s' "$value"
          }
          migration_url="$(env_value OPENBOOKS_MIGRATION_DB_URL)"
          runtime_url="$(env_value OPENBOOKS_RUNTIME_DB_URL)"
          if [ -z "$runtime_url" ]; then runtime_url="$(env_value OPENBOOKS_DB_URL)"; fi
          if [ -z "$migration_url" ]; then
            migration_url="$(resolve_placeholders "$(compose_web_value OPENBOOKS_MIGRATION_DB_URL)" || true)"
          fi
          if [ -z "$runtime_url" ]; then
            runtime_url="$(resolve_placeholders "$(compose_web_value OPENBOOKS_RUNTIME_DB_URL)" || true)"
          fi
          if [ -z "$runtime_url" ]; then
            runtime_url="$(resolve_placeholders "$(compose_web_value OPENBOOKS_DB_URL)" || true)"
          fi
          # Pre-role-split dev deployments used PostgreSQL's explicit postgres
          # owner plus POSTGRES_PASSWORD. Convert that declared configuration
          # deterministically; the bootstrap connection still verifies it.
          if [ -z "$migration_url" ] && [ -n "$runtime_url" ]; then
            owner_password="$(env_value POSTGRES_PASSWORD)"
            if [ -n "$owner_password" ]; then
              echo "::add-mask::$owner_password"
              migration_url="$(RUNTIME_URL="$runtime_url" OWNER_PASSWORD="$owner_password" node -e '
                const url = new URL(process.env.RUNTIME_URL);
                url.username = "postgres";
                url.password = process.env.OWNER_PASSWORD;
                process.stdout.write(url.toString());
              ')"
            fi
          fi
          # Managed Dokploy databases keep their owner credential in the
          # database resource, not the application environment. Resolve one
          # exact database/owner match through the authenticated catalog.
          if [ -z "$migration_url" ] && [ -n "$runtime_url" ]; then
            runtime_database="$(RUNTIME_URL="$runtime_url" node -e '
              process.stdout.write(new URL(process.env.RUNTIME_URL).pathname.replace(/^\//, ""));
            ')"
            project_catalog="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" "$base/api/project.all")"
            candidates="$(jq -c --arg database "$runtime_database" '
              [.. | objects
                | select(.postgresId? != null)
                | select(.databaseName == $database and .databaseUser == "postgres")]
              | unique_by(.postgresId)
            ' <<<"$project_catalog")"
            if [ "$(jq 'length' <<<"$candidates")" = "1" ]; then
              owner_user="$(jq -r '.[0].databaseUser' <<<"$candidates")"
              owner_password="$(jq -r '.[0].databasePassword' <<<"$candidates")"
              echo "::add-mask::$owner_password"
              migration_url="$(RUNTIME_URL="$runtime_url" OWNER_USER="$owner_user" OWNER_PASSWORD="$owner_password" node -e '
                const url = new URL(process.env.RUNTIME_URL);
                url.username = process.env.OWNER_USER;
                url.password = process.env.OWNER_PASSWORD;
                process.stdout.write(url.toString());
              ')"
            fi
          fi
          if [ -z "$migration_url" ] || [ -z "$runtime_url" ]; then
            echo "::error::Dev deployment requires separate OPENBOOKS_MIGRATION_DB_URL and runtime database URLs"
            echo "Available Dokploy environment keys:"
            sed -n 's/^\([A-Z0-9_]*\)=.*/\1/p' <<<"$env_text" | sort -u
            echo "Configured web environment keys:"
            awk '
              /^  web:[[:space:]]*$/ { in_web=1; next }
              in_web && /^  [[:alnum:]_-]+:[[:space:]]*$/ { exit }
              in_web && /^[[:space:]]+[A-Z0-9_]+:/ {
                line=$0; sub(/^[[:space:]]+/, "", line); sub(/:.*/, "", line); print line
              }
              in_web && /^[[:space:]]*-[[:space:]]*[A-Z0-9_]+=/ {
                line=$0; sub(/^[[:space:]]*-[[:space:]]*/, "", line); sub(/=.*/, "", line); print line
              }
            ' <<<"$(jq -r '.composeFile // ""' <<<"$current")" | sort -u
            echo "Managed PostgreSQL metadata (credentials omitted):"
            jq -c '[.. | objects | select(.postgresId? != null) |
              {postgresId,name,appName,databaseName,databaseUser,externalPort}]' \
              <<<"${project_catalog:-[]}" || true
            exit 1
          fi
          echo "::add-mask::$migration_url"
          echo "::add-mask::$runtime_url"
          bootstrap_env="$(mktemp)"
          cleanup() { rm -f "$bootstrap_env"; }
          trap cleanup EXIT
          chmod 600 "$bootstrap_env"
          {
            printf 'NODE_ENV=production\n'
            printf 'OPENBOOKS_BOOTSTRAP=1\n'
            printf 'OPENBOOKS_MIGRATION_DB_URL=%s\n' "$migration_url"
            printf 'OPENBOOKS_RUNTIME_DB_URL=%s\n' "$runtime_url"
            for key in ORG_NAME ORG_CURRENCY ORG_COUNTRY ADMIN_EMAIL ADMIN_NAME ADMIN_PASSWORD; do
              value="$(env_value "$key")"
              if [ -n "$value" ]; then printf '%s=%s\n' "$key" "$value"; fi
            done
          } > "$bootstrap_env"
          docker pull "$IMAGE_NAME:$NEW_TAG"
          docker run --rm --env-file "$bootstrap_env" \
            "$IMAGE_NAME:$NEW_TAG" node scripts/bootstrap.mjs

      - name: Select image and deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          NEW_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          current="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
          env_text="$(jq -r '.env // ""' <<<"$current")"
          if grep -q '^OPENBOOKS_TAG=' <<<"$env_text"; then
            new_env="$(sed "s|^OPENBOOKS_TAG=.*|OPENBOOKS_TAG=${NEW_TAG}|" <<<"$env_text")"
          else
            new_env="$(printf '%s\nOPENBOOKS_TAG=%s\n' "$env_text" "$NEW_TAG")"
          fi
          compose_file="$(jq -r '.composeFile // empty' <<<"$current")"
          if [ -z "$compose_file" ]; then
            echo "::error::The configured deployment has no compose source"
            exit 1
          fi
          jq -n --arg id "$COMPOSE_ID" --arg env "$new_env" --arg composeFile "$compose_file" \
            '{composeId:$id, env:$env, composeFile:$composeFile}' \
            | curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
                -H 'content-type: application/json' \
                -X POST "$base/api/compose.update" --data @- > /dev/null
          curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
            -H 'content-type: application/json' \
            -X POST "$base/api/compose.deploy" \
            --data "{\"composeId\":\"$COMPOSE_ID\"}"
          echo "Deployment queued for immutable image tag ${NEW_TAG}"

      - name: Wait for deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          base="${DOKPLOY_URL%/}"
          for i in $(seq 1 60); do
            sleep 10
            latest="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
              -G "$base/api/deployment.allByCompose" --data-urlencode "composeId=$COMPOSE_ID" \
              | jq -r 'sort_by(.createdAt) | last | .status // "unknown"')"
            echo "deployment status: $latest (poll $i)"
            case "$latest" in
              done) exit 0 ;;
              error) echo "::error::Deployment failed"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for deployment"
          exit 1

      - name: Verify web and worker health
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          APP_URL: ${{ vars.OPENBOOKS_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ]; then
            base="${DOKPLOY_URL%/}"
            compose="$(curl -sS --fail -H "x-api-key: $DOKPLOY_TOKEN" \
              -G "$base/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID")"
            host="$(jq -r '[.domains[]? | select((.host // "") != "")] | first | .host // empty' <<<"$compose")"
            use_https="$(jq -r '[.domains[]? | select((.host // "") != "")] | first | .https // false' <<<"$compose")"
            [ -n "$host" ] || { echo "::error::No application URL is configured"; exit 1; }
            if [ "$use_https" = "true" ]; then APP_URL="https://$host"; else APP_URL="http://$host"; fi
          fi
          app_url="${APP_URL%/}"
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "$app_url/api/v1/health?include=worker" || true)"
            echo "web + worker health: HTTP $code (poll $i)"
            if [ "$code" = "200" ]; then
              echo "OpenBooks dev is healthy at $app_url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Application never became healthy"
          exit 1
