name: test

# Test gate for the monorepo. Jobs:
#   typecheck   — fast, no database; fails on any workspace tsc error or a
#                 product-neutrality violation so broken code cannot reach main
#   unit        — fast, no database; integration files self-skip
#   integration — full suite against a throwaway postgres:16, with a canary
#                 that fails the job if the DB-backed tests silently skipped
#   coverage    — full suite with V8 coverage, summary in the job page + lcov
#                 artifact upload
#   e2e         — Playwright browser smoke against the real app + real DB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic non-production keys for token round-trip and encrypted-secret
  # integration tests. Production credentials are supplied only by the
  # deployment environment.
  SESSION_SECRET: openbooks-ci-test-secret-not-production
  OPENBOOKS_DATA_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  ORG_COUNTRY: US
  ORG_CURRENCY: USD

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test workflow contract
        run: node --test scripts/test-workflow.test.mjs
      - name: Product-neutrality audit
        run: npm run check:product-neutrality
      - name: Typecheck every workspace
        # Fails the job if any workspace with a `typecheck` script errors;
        # workspaces without one are skipped by --if-present.
        run: npm run typecheck --workspaces --if-present

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install qpdf
        # Payroll ciphertext certification shells out to the real qpdf binary;
        # without it the sender fail-closes on spawn ENOENT and the suite can
        # never exercise the verified-ciphertext contract.
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: Unit tests (no database)
        # OPENBOOKS_DB_URL deliberately unset/empty: *.integration.test.ts
        # files self-skip, everything else must pass. Keep file-level fan-out
        # bounded so a larger dependency graph cannot exhaust runner resources.
        env:
          OPENBOOKS_DB_URL: ""
        run: npm test -- --test-concurrency=4

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks
          POSTGRES_DB: openbooks_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks -d openbooks_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPENBOOKS_DB_URL: postgres://openbooks:openbooks@localhost:5433/openbooks_test
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-ci-password@localhost:5433/openbooks_test
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-ci-password
      PGPASSWORD: openbooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install qpdf
        # Payroll ciphertext certification shells out to the real qpdf binary;
        # without it the sender fail-closes on spawn ENOENT and the suite can
        # never exercise the verified-ciphertext contract.
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Load schema
        # The production bootstrap is the authoritative provisioner: tracked
        # canonical baseline, row-level security, and base seeds.
        run: npx tsx scripts/bootstrap.ts

      - name: Integration canary
        # DB-backed tests self-skip when OPENBOOKS_DB_URL is missing, which
        # would turn this job green while running nothing. Run one known
        # integration file and hard-fail if anything skipped or nothing ran.
        shell: bash
        run: |
          # `tee` exits 0, so without pipefail a failing suite greens the step.
          set -o pipefail
          node --import tsx --test --test-force-exit --test-reporter=tap \
            engine/src/kernel-constraints.integration.test.ts 2>&1 | tee canary.tap
          node -e 'const s=require("fs").readFileSync("canary.tap","utf8"); if (/# SKIP(?:\s|$)/im.test(s)) { console.error("FATAL: integration tests skipped — DB wiring is broken"); process.exit(1); } if (/^not ok \d+ - /m.test(s)) { console.error("FATAL: canary recorded a failing test"); process.exit(1); } if (!/^# fail 0$/m.test(s)) { console.error("FATAL: canary did not report zero failures"); process.exit(1); } if (!/^ok \d+ - /m.test(s)) { console.error("FATAL: canary ran zero tests"); process.exit(1); } console.log("canary ok: integration tests executed against the database");'

      - name: Full test suite (with database)
        run: npm test

      - name: Drive a seeded company through real activity
        # The golden harness below is only meaningful over a ledger that real
        # activity has stressed. The simulation provisions a deterministic,
        # sim-tagged company and runs it through three months of transactions;
        # without this, every harness tie-out would pass vacuously on the
        # pristine bootstrap tenant and the gate would assert nothing. The sim
        # refuses to run without OPENBOOKS_SIM=1 — that interlock is the point.
        env:
          OPENBOOKS_SIM: "1"
        shell: bash
        run: |
          # The pipe reports the LAST command's status; without pipefail a
          # failed provision that still printed JSON would read as success.
          set -o pipefail
          RUN=$(npm --prefix engine run --silent sim -- provision \
            --profile general-contractor --seed 1 --start 2026-01-01 --end 2026-03-31 \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runDir))')
          npm --prefix engine run --silent sim -- run "$RUN"
          echo "SIM_RUN=$RUN" >> "$GITHUB_ENV"

      - name: Golden harness asserts the ledger invariants
        # The harness exits non-zero when any hard check fails (trial balance,
        # subledger↔GL and inventory tie-outs), so a fix that breaks a ledger
        # invariant fails HERE, before merge — not at the next audit. Same
        # contract trust.yml's invariants job enforces; this copy is what the
        # pull request actually waits for. Pinned by
        # scripts/ci-pipeline-integrity.test.mjs so it cannot be dropped.
        run: |
          ORG_ID=$(node -e '
            const { readFileSync } = require("node:fs");
            const { join } = require("node:path");
            const manifest = JSON.parse(readFileSync(join(process.env.SIM_RUN, "manifest.json"), "utf8"));
            if (!manifest.orgId) throw new Error("simulation manifest is missing orgId");
            process.stdout.write(manifest.orgId);
          ')
          npm --prefix engine run --silent harness -- "$ORG_ID"

      - name: Upload defect bundles (if the oracle halted)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sim-defects-integration
          path: engine/sim-runs/**/defects/**
          if-no-files-found: ignore

  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks_owner
          POSTGRES_PASSWORD: openbooks-owner-restore-test-password
          POSTGRES_DB: openbooks_restore
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks_owner -d openbooks_restore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENBOOKS_DB_URL: postgres://openbooks_owner:openbooks-owner-restore-test-password@localhost:5433/openbooks_restore
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-restore-test-password@localhost:5433/openbooks_restore
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-restore-test-password
      PGPASSWORD: openbooks-owner-restore-test-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bootstrap restore-drill database
        run: npx tsx scripts/bootstrap.ts
      - name: Export, destroy, restore, and verify an isolated backup
        env:
          OPENBOOKS_RESTORE_DRILL: "1"
          OPENBOOKS_TRUSTED_TEST_BYPASS: "1"
        run: >-
          node --import tsx --import ./engine/src/test-database-bypass.ts
          --test --test-force-exit
          engine/src/backup-restore.integration.test.ts

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks
          POSTGRES_DB: openbooks_coverage
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks -d openbooks_coverage"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPENBOOKS_DB_URL: postgres://openbooks:openbooks@localhost:5433/openbooks_coverage
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-ci-password@localhost:5433/openbooks_coverage
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-ci-password
      PGPASSWORD: openbooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install qpdf
        # Payroll ciphertext certification shells out to the real qpdf binary;
        # without it the sender fail-closes on spawn ENOENT and the suite can
        # never exercise the verified-ciphertext contract.
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Load schema
        run: npx tsx scripts/bootstrap.ts

      - name: Test suite with coverage
        env:
          # The same trusted-bypass contract the root `npm test` script and the
          # restore drill use. Without it every DB-backed integration file
          # throws on import, and this job silently measured a smaller suite.
          NODE_ENV: test
          OPENBOOKS_TRUSTED_TEST_BYPASS: "1"
        shell: bash
        run: |
          # `tee` exits 0, so without pipefail a failing suite greens the step.
          set -o pipefail
          # Membership must match the canonical `npm test` command exactly.
          # It did not: web/app and web/components suites and both script tests
          # never ran here, while the job advertised itself as the full suite
          # and published an lcov artifact that had not executed them.
          node --import tsx --import ./engine/src/test-database-bypass.ts \
            --test --test-force-exit --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=lcov.info \
            'scripts/deploy-edge-workflow.test.mjs' 'scripts/ci-pipeline-integrity.test.mjs' \
            'engine/src/**/*.test.ts' 'packages/**/*.test.ts' \
            'web/**/*.test.ts' 'schema/**/*.test.ts' 2>&1 | tee coverage.txt

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "# Test coverage"
            echo ""
            echo '```'
            awk '/start of coverage report/,0' coverage.txt | sed 's/^ℹ //' | head -60 || tail -40 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks
          POSTGRES_DB: openbooks_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks -d openbooks_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPENBOOKS_DB_URL: postgres://openbooks:openbooks@localhost:5433/openbooks_e2e
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-ci-password@localhost:5433/openbooks_e2e
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-ci-password
      PGPASSWORD: openbooks
      SESSION_SECRET: e2e-ci-secret-not-production
      ADMIN_EMAIL: e2e@openbooks.test
      ADMIN_NAME: E2E Admin
      ADMIN_PASSWORD: e2e-test-password-123
      E2E_EMAIL: e2e@openbooks.test
      E2E_PASSWORD: e2e-test-password-123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Load schema + seed admin
        # bootstrap creates the first org, roles, calendars, and — because
        # ADMIN_EMAIL is set — the admin login the specs authenticate with.
        run: npx tsx scripts/bootstrap.ts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
