name: test

# Test gate for the monorepo. Jobs:
#   typecheck   — fast, no database; fails on any workspace tsc error or a
#                 product-neutrality violation so broken code cannot reach main
#   integration — full suite against a throwaway postgres:16, with a canary
#                 that fails the job if the DB-backed tests silently skipped.
#                 This job is the SOLE runner of the unit suite too: the old
#                 unit job ran the identical `npm test` with an empty
#                 OPENBOOKS_DB_URL (every DB file self-skips), a strict
#                 file-for-file subset of this run, while paying a second
#                 checkout + npm ci + runner per push. Deleted 2026-09: the
#                 concurrency-4 override went with it, strictly reducing flake
#                 surface toward the canonical --test-concurrency=1.
#   e2e         — Playwright browser smoke against the real app + real DB

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the disaster-recovery drill only.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic non-production keys for token round-trip and encrypted-secret
  # integration tests. Production credentials are supplied only by the
  # deployment environment.
  SESSION_SECRET: openbooks-ci-test-secret-not-production
  OPENBOOKS_DATA_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
  ORG_COUNTRY: US
  ORG_CURRENCY: USD

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test workflow contract
        run: node --test scripts/test-workflow.test.mjs
      - name: Product-neutrality audit
        run: npm run check:product-neutrality
      - name: Typecheck every workspace
        # Fails the job if any workspace with a `typecheck` script errors;
        # workspaces without one are skipped by --if-present.
        run: npm run typecheck --workspaces --if-present

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks
          POSTGRES_DB: openbooks_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks -d openbooks_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4.5-alpine3.21@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPENBOOKS_DB_URL: postgres://openbooks:openbooks@localhost:5433/openbooks_test
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-ci-password@localhost:5433/openbooks_test
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-ci-password
      OPENBOOKS_REDIS_URL: redis://localhost:6379/0
      # Pooling is permitted only for this explicitly provisioned disposable
      # database. The marker is set by the provisioning step below and checked
      # from pg_database by the fixture owner before any tenant is leased.
      OPENBOOKS_TEST_DB_ISOLATED: "1"
      OPENBOOKS_TEST_FIXTURE_POOL_SIZE: "4"
      PGPASSWORD: openbooks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Register reachability tests audit local main and historical closing
          # commits; a shallow checkout turns those checks into a partial pass.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install qpdf
        # Payroll ciphertext certification shells out to the real qpdf binary;
        # without it the sender fail-closes on spawn ENOENT and the suite can
        # never exercise the verified-ciphertext contract.
        run: sudo apt-get update && sudo apt-get install -y qpdf

      - name: Load schema
        # The production bootstrap is the authoritative provisioner: tracked
        # canonical baseline, row-level security, and base seeds.
        run: npx tsx scripts/bootstrap.ts

      - name: Mark database as the owned ephemeral fixture
        # A caller-controlled OPENBOOKS_TEST_DB_ISOLATED flag is not authority.
        # The fixture pool requires this database-side nonce, which is written
        # only after the throwaway service is provisioned in this job.
        shell: bash
        run: |
          set -euo pipefail
          MARKER="openbooks-ci-ephemeral-$(uuidgen)"
          psql "$OPENBOOKS_DB_URL" -v ON_ERROR_STOP=1 \
            -c "comment on database openbooks_test is '$MARKER'"
          echo "OPENBOOKS_TEST_DB_MARKER=$MARKER" >> "$GITHUB_ENV"

      - name: Integration canary
        # DB-backed tests self-skip when OPENBOOKS_DB_URL is missing, which
        # would turn this job green while running nothing. Run one known
        # integration file and hard-fail if anything skipped or nothing ran.
        shell: bash
        run: |
          # `tee` exits 0, so without pipefail a failing suite greens the step.
          set -o pipefail
          node --import tsx --test --test-force-exit --test-reporter=tap \
            engine/src/kernel-constraints.integration.test.ts 2>&1 | tee canary.tap
          node -e 'const s=require("fs").readFileSync("canary.tap","utf8"); if (/# SKIP(?:\s|$)/im.test(s)) { console.error("FATAL: integration tests skipped — DB wiring is broken"); process.exit(1); } if (/^not ok \d+ - /m.test(s)) { console.error("FATAL: canary recorded a failing test"); process.exit(1); } if (!/^# fail 0$/m.test(s)) { console.error("FATAL: canary did not report zero failures"); process.exit(1); } if (!/^ok \d+ - /m.test(s)) { console.error("FATAL: canary ran zero tests"); process.exit(1); } console.log("canary ok: integration tests executed against the database");'

      - name: Full test suite (with database)
        shell: bash
        run: |
          # The canonical `npm test` script fans out to the manifest-owned
          # unit and integration partitions (the integration partition runs
          # under the single fixture owner). Flags appended here reach the
          # integration run, which produces the lcov artifact and the
          # owner lifecycle receipt verified by the step below.
          set -o pipefail
          npm test -- --experimental-test-coverage \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=lcov.info 2>&1 | tee coverage.txt

      - name: Verify bounded fixture lifecycle receipt
        # The single aggregator owner emits one immutable receipt after every
        # lease has been released. Fail if full work multiplied by test files,
        # or if a teardown/schema-wide verification was omitted.
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('coverage.txt', 'utf8');
          const line = text.split('\n').find((value) => value.startsWith('[fixture-lifecycle] '));
          if (!line) throw new Error('missing fixture lifecycle receipt');
          const metrics = JSON.parse(line.slice('[fixture-lifecycle] '.length));
          const budget = Number(process.env.OPENBOOKS_TEST_FIXTURE_POOL_SIZE);
          for (const key of ['fullBootstrap', 'fullTeardown', 'schemaWideVerification']) {
            if (!Number.isInteger(metrics[key]) || metrics[key] > budget) throw new Error(`${key} exceeded pool budget: ${metrics[key]} > ${budget}`);
          }
          if (metrics.fullTeardown !== metrics.fullBootstrap || metrics.schemaWideVerification !== metrics.fullTeardown) throw new Error(`incomplete fixture lifecycle: ${JSON.stringify(metrics)}`);
          if (metrics.activeLeases !== 0 || metrics.leakDetections !== 0) throw new Error(`fixture leak detected: ${JSON.stringify(metrics)}`);
          console.log(`fixture lifecycle ok: ${JSON.stringify(metrics)}`);
          NODE

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "# Test coverage"
            echo ""
            echo '```'
            awk '/start of coverage report/,0' coverage.txt | sed 's/^ℹ //' | head -60 || tail -40 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt
          if-no-files-found: ignore
      - name: Drive a seeded company through real activity
        # The golden harness below is only meaningful over a ledger that real
        # activity has stressed. The simulation provisions a deterministic,
        # sim-tagged company and runs it through three months of transactions;
        # without this, every harness tie-out would pass vacuously on the
        # pristine bootstrap tenant and the gate would assert nothing. The sim
        # refuses to run without OPENBOOKS_SIM=1 — that interlock is the point.
        env:
          OPENBOOKS_SIM: "1"
        shell: bash
        run: |
          # The pipe reports the LAST command's status; without pipefail a
          # failed provision that still printed JSON would read as success.
          set -o pipefail
          RUN=$(npm --prefix engine run --silent sim -- provision \
            --profile general-contractor --seed 1 --start 2026-01-01 --end 2026-03-31 \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).runDir))')
          npm --prefix engine run --silent sim -- run "$RUN"
          echo "SIM_RUN=$RUN" >> "$GITHUB_ENV"

      - name: Golden harness asserts the ledger invariants
        # The harness exits non-zero when any hard check fails (trial balance,
        # subledger↔GL and inventory tie-outs), so a fix that breaks a ledger
        # invariant fails HERE, before merge — not at the next audit. This is
        # the SOLE harness run in CI: the trust.yml invariants copy was
        # deleted 2026-09 as byte-identical duplication (same profile, seed,
        # and window), and the trust publish job consumes the checkpoint
        # emitted below. Pinned by scripts/ci-pipeline-integrity.test.mjs so
        # it cannot be dropped or duplicated.
        run: |
          ORG_ID=$(node -e '
            const { readFileSync } = require("node:fs");
            const { join } = require("node:path");
            const manifest = JSON.parse(readFileSync(join(process.env.SIM_RUN, "manifest.json"), "utf8"));
            if (!manifest.orgId) throw new Error("simulation manifest is missing orgId");
            process.stdout.write(manifest.orgId);
          ')
          npm --prefix engine run --silent harness -- "$ORG_ID"

      - name: Assert the simulated company exercised the required scenarios
        # Folded in from the deleted sim-smoke.yml 2026-09: the only content
        # there not already covered by this job was this coverage-kinds gate.
        # sim-smoke ran byte-identical provision/run commands on a strict
        # subset of this workflow's triggers, so the workflow itself earned
        # no keep; this one line preserves its unique signal.
        run: npm --prefix engine run --silent sim -- coverage "$SIM_RUN" --require vendor_bill,vendor_payment,customer_invoice,customer_payment,period_close,period_immutability

      - name: Upload checkpoint for the trust evidence pipeline
        # trust.yml publish consumes this artifact via workflow_run. Same-run
        # provenance: it describes the exact harness run above, on this SHA.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkpoint
          path: engine/harness-checkpoints/
          if-no-files-found: error

      - name: Upload defect bundles (if the oracle halted)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sim-defects-integration
          path: engine/sim-runs/**/defects/**
          if-no-files-found: ignore


  restore-drill:
    # A backup export/destroy/restore rehearsal is a disaster-recovery drill,
    # not a per-commit gate. Nightly and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks_owner
          POSTGRES_PASSWORD: openbooks-owner-restore-test-password
          POSTGRES_DB: openbooks_restore
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks_owner -d openbooks_restore"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENBOOKS_DB_URL: postgres://openbooks_owner:openbooks-owner-restore-test-password@localhost:5433/openbooks_restore
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-restore-test-password@localhost:5433/openbooks_restore
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-restore-test-password
      PGPASSWORD: openbooks-owner-restore-test-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bootstrap restore-drill database
        run: npx tsx scripts/bootstrap.ts
      - name: Export, destroy, restore, and verify an isolated backup
        env:
          OPENBOOKS_RESTORE_DRILL: "1"
          OPENBOOKS_TRUSTED_TEST_BYPASS: "1"
        run: >-
          node --import tsx --import ./engine/src/test-database-bypass.ts
          --test --test-force-exit
          engine/src/backup-restore.integration.test.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.9-alpine3.22@sha256:7c688148e5e156d0e86df7ba8ae5a05a2386aaec1e2ad8e6d11bdf10504b1fb7
        env:
          POSTGRES_USER: openbooks
          POSTGRES_PASSWORD: openbooks
          POSTGRES_DB: openbooks_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openbooks -d openbooks_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      OPENBOOKS_DB_URL: postgres://openbooks:openbooks@localhost:5433/openbooks_e2e
      OPENBOOKS_RUNTIME_DB_URL: postgres://openbooks_app:openbooks-runtime-ci-password@localhost:5433/openbooks_e2e
      OPENBOOKS_DB_PASSWORD: openbooks-runtime-ci-password
      PGPASSWORD: openbooks
      SESSION_SECRET: e2e-ci-secret-not-production
      ADMIN_EMAIL: e2e@openbooks.test
      ADMIN_NAME: E2E Admin
      ADMIN_PASSWORD: e2e-test-password-123
      E2E_EMAIL: e2e@openbooks.test
      E2E_PASSWORD: e2e-test-password-123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Load schema + seed admin
        # bootstrap creates the first org, roles, calendars, and — because
        # ADMIN_EMAIL is set — the admin login the specs authenticate with.
        run: npx tsx scripts/bootstrap.ts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
