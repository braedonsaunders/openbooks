# Throwaway Postgres for the OpenBooks simulation harness.
# NEVER point the harness at real data — the DB name carries a `sim` marker so
# the CLI's guard permits it, and `reset` wipes whole orgs.
services:
  openbooks-sim-db:
    image: postgres:16
    container_name: openbooks-sim-db
    environment:
      POSTGRES_USER: openbooks
      POSTGRES_PASSWORD: openbooks
      POSTGRES_DB: openbooks_sim
    ports:
      - "5433:5432"
    volumes:
      - openbooks-sim-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbooks -d openbooks_sim"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  openbooks-sim-data:
