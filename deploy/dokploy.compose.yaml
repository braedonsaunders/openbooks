# openbooks dev stack for Dokploy (project "openbooks").
#
# Deployed as a SWARM STACK (composeType "stack") pinned to the manager node,
# matching the other cluster apps (beaconhs, minio). Swarm placement puts the
# service on the same node as dokploy-traefik and makes it visible to Traefik's
# swarm provider; ingress is wired by a Dokploy managed domain (file provider),
# the proven routing path for *.cloud.rassaun.com. The GitHub deploy workflow
# bumps OPENBOOKS_TAG and triggers compose.deploy.
#
# Database: the EXISTING Patroni pgcluster VM database (never a bundled
# Postgres). MinIO blob storage is reached over its public S3 endpoint.

networks:
  dokploy-network:
    external: true

services:
  web:
    image: ghcr.io/braedonsaunders/openbooks:${OPENBOOKS_TAG:-latest}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      OPENBOOKS_DB_URL: ${OPENBOOKS_DB_URL}
      # BullMQ queues (emails, reports, sandbox) → the HA Redis VM.
      OPENBOOKS_REDIS_URL: ${OPENBOOKS_REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENBOOKS_DATA_KEY: ${OPENBOOKS_DATA_KEY}
      # File-cabinet blob storage → shared MinIO via its public S3 endpoint.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      # First-boot seed (org + admin). No-ops on the existing database.
      ORG_NAME: ${ORG_NAME}
      ORG_CURRENCY: ${ORG_CURRENCY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - dokploy-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 2g
      restart_policy:
        condition: any
        delay: 5s

  # Background worker — BullMQ consumers (emails, reports, sandbox) + the report
  # and sandbox refresh schedulers. Same image as web, run with the bundled
  # worker entrypoint instead of the web server. No ingress, no bootstrap (web
  # owns migrations); it just processes the queues off the HA Redis VM.
  worker:
    image: ghcr.io/braedonsaunders/openbooks:${OPENBOOKS_TAG:-latest}
    command: ["node", "scripts/worker.mjs"]
    environment:
      NODE_ENV: production
      OPENBOOKS_DB_URL: ${OPENBOOKS_DB_URL}
      OPENBOOKS_REDIS_URL: ${OPENBOOKS_REDIS_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      OPENBOOKS_DATA_KEY: ${OPENBOOKS_DATA_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - dokploy-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname==dokploy-mgr
      resources:
        limits:
          memory: 1g
      restart_policy:
        condition: any
        delay: 5s
