apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbooks-default-deny-ingress
  labels:
    app.kubernetes.io/name: openbooks
    app.kubernetes.io/component: configuration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbooks
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbooks-web-trusted-ingress
  labels:
    app.kubernetes.io/name: openbooks
    app.kubernetes.io/component: configuration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbooks
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    # Fail closed until the operator labels both the ingress namespace and its
    # controller pods. This is the only client path trusted to set forwarding
    # headers when OPENBOOKS_TRUST_PROXY=1.
    - from:
        - namespaceSelector:
            matchLabels:
              openbooks.network/trusted-proxy: "true"
          podSelector:
            matchLabels:
              openbooks.network/trusted-proxy: "true"
      ports:
        - protocol: TCP
          port: 3000
    # Workers call the internal web Service for authenticated internal jobs.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openbooks
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 3000
